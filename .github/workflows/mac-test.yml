name: macOS Test-Build

# Baut die macOS-DMGs ohne Release, prüft die Signatur und legt sie unter Artifacts ab.
on:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - run: npm install
      - run: npm run build

      # Versionsvergleich, Asset-Auswahl und ein Abruf der echten GitHub-Releases
      - name: Update-Tests
        run: npm test
        env:
          UPDATE_NETZTEST: 1

      - name: Package
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Signatur in den DMGs prüfen
        run: |
          for dmg in dist/*.dmg; do
            mnt=$(mktemp -d)
            hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt" >/dev/null
            codesign --verify --deep --strict --verbose=2 "$mnt/Stromplaner.app"
            codesign -dv "$mnt/Stromplaner.app" 2>&1 | grep -E 'Signature|Format'
            hdiutil detach "$mnt" >/dev/null
          done

      # Die gepackte App muss starten (fehlt z. B. ein Modul in build.files, beendet sie sich sofort)
      - name: Starttest
        run: |
          app=dist/mac-arm64/Stromplaner.app/Contents/MacOS/Stromplaner
          "$app" > start.log 2>&1 &
          pid=$!
          sleep 20
          if ! kill -0 $pid 2>/dev/null; then cat start.log; echo "App hat sich beendet"; exit 1; fi
          kill $pid
          grep -i 'error' start.log || true

      - uses: actions/upload-artifact@v4
        with:
          name: Stromplaner-macOS
          path: dist/*.dmg
          retention-days: 7
