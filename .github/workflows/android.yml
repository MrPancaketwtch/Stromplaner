name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    # Secrets lassen sich in `if:` nicht direkt abfragen – daher als Job-Variable
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'   # Capacitor 8 braucht JDK 21

      - name: Copy icon for PWA build
        run: mkdir -p webapp/public && cp build/icon.png webapp/public/icon.png

      - name: Install webapp dependencies
        working-directory: webapp
        run: npm ci

      - name: Build PWA
        working-directory: webapp
        run: npm run build
        env:
          BASE_URL: /

      - name: Add Capacitor Android platform
        working-directory: webapp
        run: npx cap add android

      - name: Patch AndroidManifest (camera + cleartext HTTP)
        working-directory: webapp
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # Allow cleartext HTTP for sync server and local share (Android 9+ blocks it by default)
          sed -i 's|android:supportsRtl="true"|android:supportsRtl="true"\n        android:usesCleartextTraffic="true"|' "$MANIFEST"
          # Add camera permission for QR scanner (getUserMedia requires it)
          grep -q 'android.permission.CAMERA' "$MANIFEST" || \
            sed -i 's|    <application|    <uses-permission android:name="android.permission.CAMERA" />\n    <application|' "$MANIFEST"

      - name: Generate app icon and splash screen
        working-directory: webapp
        run: >
          npx @capacitor/assets generate --android
          --iconBackgroundColor '#1c2127' --iconBackgroundColorDark '#1c2127'
          --splashBackgroundColor '#15191e' --splashBackgroundColorDark '#15191e'

      - name: Sync web assets into Android project
        working-directory: webapp
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: webapp/android
        run: chmod +x gradlew

      # Android installiert ein Update nur, wenn versionCode steigt
      - name: Set app version
        working-directory: webapp/android
        run: |
          VERSION=$(node -p "require('../../package.json').version")
          sed -i "s/versionCode 1\b/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$VERSION\"/" app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle

      # ── Signierung (Secrets einrichten: scripts/setup-android-signing.ps1) ──
      #   ANDROID_KEYSTORE_BASE64  - base64-codierter Keystore
      #   ANDROID_KEY_ALIAS        - Alias des Schlüssels
      #   ANDROID_KEY_PASSWORD     - Passwort des Schlüssels
      #   ANDROID_STORE_PASSWORD   - Passwort des Keystores
      - name: Build release APK + App-Bundle (signed)
        if: env.HAS_SIGNING == 'true'
        working-directory: webapp/android
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          rm -f "$RUNNER_TEMP/release.keystore"
        env:
          ANDROID_KEYSTORE_BASE64:  ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD:   ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS:        ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD:     ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build debug APK (keine Signier-Secrets hinterlegt)
        if: env.HAS_SIGNING != 'true'
        working-directory: webapp/android
        run: ./gradlew assembleDebug

      # ── Locate built APK ──────────────────────────────────────────────────
      - name: Find APK
        id: find-apk
        run: |
          APK=$(find webapp/android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stromplaner-Android
          path: ${{ steps.find-apk.outputs.path }}

      # App-Bundle für den Google Play Store (nur mit Signierung)
      - name: Upload App-Bundle as artifact
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Stromplaner-PlayStore-Bundle
          path: webapp/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # Das Release legt electron-builder im Workflow „Build & Release“ an – das dauert länger als dieser Build
      - name: Attach APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          for i in $(seq 1 60); do
            gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1 && break
            echo "Warte auf Release $TAG … ($i/60)"; sleep 30
          done
          APK="Stromplaner-${TAG#v}.apk"
          cp "${{ steps.find-apk.outputs.path }}" "$APK"
          gh release upload "$TAG" "$APK" --repo "${{ github.repository }}" --clobber
