name: Android APK (manuell)

on:
  workflow_dispatch:
    inputs:
      pwa_url:
        description: 'URL der gehosteten PWA (für TWA)'
        required: true
        default: 'https://mrpancaketwtch.github.io/Stromplaner/'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Initialize TWA project
        run: |
          mkdir -p twa-build
          cd twa-build
          bubblewrap init \
            --manifest "${{ github.event.inputs.pwa_url }}manifest.webmanifest" \
            --directory . \
            --skip-pwa-shell-update || true

      - name: Build APK
        working-directory: twa-build
        run: bubblewrap build --skipPwaValidation

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stromplaner-android
          path: twa-build/app-release-unsigned.apk
          if-no-files-found: warn

      - name: Attach APK to latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          if [ -n "$TAG" ] && [ -f twa-build/app-release-unsigned.apk ]; then
            gh release upload "$TAG" twa-build/app-release-unsigned.apk \
              --repo "${{ github.repository }}" \
              --clobber
            echo "APK zu Release $TAG hochgeladen."
          fi
