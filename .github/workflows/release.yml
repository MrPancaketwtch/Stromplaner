name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Release vorab anlegen: Sonst wollen Windows- und Mac-Job ihn gleichzeitig erstellen,
  # und der langsamere scheitert mit 422 "already_exists".
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG existiert bereits."
            exit 0
          fi
          PRE=""
          case "$TAG" in *-*) PRE="--prerelease" ;; esac
          gh release create "$TAG" --verify-tag --title "${TAG#v}" --notes "Wird gebaut …" $PRE

  release:
    needs: create-release
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build

      # Tags mit Bindestrich (v1.3.0-beta.1) werden Pre-releases: die In-App-Updates normaler Nutzer
      # ignorieren sie. EP_PRE_RELEASE hat bei electron-builder Vorrang vor publish.releaseType.
      - name: Package & publish
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          EP_PRE_RELEASE: ${{ contains(github.ref_name, '-') }}

  release-notes:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update release description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${{ github.ref_name }}"
          V="${VERSION#v}"
          BETA=""
          case "$V" in *-*) BETA="> **Beta-Version zum Testen** – kann noch Fehler enthalten. Installierte Stromplaner-Versionen aktualisieren sich nicht automatisch auf Betas; wer eine Beta installiert, bekommt spätere Betas und die fertige Version als Update."; esac
          # „## Neu in …“ liest auch der Update-Dialog auf dem Mac
          NEU="$(node scripts/changelog-notizen.js "$V")"
          cat > /tmp/notes.md << NOTES
          ${BETA}

          ${NEU}

          ## Herunterladen

          | Plattform | Datei |
          |---|---|
          | 🪟 **Windows** | \`Stromplaner-Setup-${V}.exe\` |
          | 🍎 **macOS (Apple Silicon / M-Series)** | \`Stromplaner-${V}-arm64.dmg\` |
          | 🍎 **macOS (Intel)** | \`Stromplaner-${V}.dmg\` |
          | 🤖 **Android (Handy-App)** | \`Stromplaner-${V}.apk\` |
          | 🌐 **PWA (Web)** | [Jetzt öffnen](https://mrpancaketwtch.github.io/Stromplaner/) |

          > **macOS-Hinweis:** Beim ersten Öffnen meldet macOS, dass die App nicht überprüft werden kann. Dann unter **Systemeinstellungen → Datenschutz & Sicherheit** ganz unten **Dennoch öffnen** wählen (bis macOS 14 geht auch Rechtsklick auf die App → **Öffnen**).
          >
          > **Android:** Die APK wird einige Minuten nach den Desktop-Dateien angehängt. Zum Installieren „Installation aus unbekannten Quellen“ für den Browser bzw. Dateimanager erlauben.

          ---

          Die anderen Dateien (\`.yml\`, \`.blockmap\`, \`.zip\`) werden intern für automatische In-App-Updates benötigt und müssen nicht manuell heruntergeladen werden.
          NOTES
          gh release edit "$VERSION" --repo "$GH_REPO" --notes-file /tmp/notes.md
