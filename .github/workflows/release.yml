name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build

      - name: Package & publish
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

  release-notes:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Update release description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${{ github.ref_name }}"
          V="${VERSION#v}"
          cat > /tmp/notes.md << NOTES
          ## Herunterladen

          | Plattform | Datei |
          |---|---|
          | 🪟 **Windows** | \`Stromplaner Setup ${V}.exe\` |
          | 🍎 **macOS (Apple Silicon / M-Series)** | \`Stromplaner-${V}-arm64.dmg\` |
          | 🍎 **macOS (Intel)** | \`Stromplaner-${V}.dmg\` |
          | 🌐 **PWA (Web / Android)** | [Jetzt öffnen](https://mrpancaketwtch.github.io/Stromplaner/) |

          > **macOS-Hinweis:** Beim ersten Öffnen erscheint eine Warnung „Entwickler nicht verifiziert" — Rechtsklick auf die App → **Öffnen** → **Öffnen** umgeht das einmalig.
          >
          > **Android:** Die PWA unter dem Link oben im Chrome öffnen → Menü → „Zum Startbildschirm hinzufügen". Ein nativer APK-Build ist über den Workflow **Android APK (manuell)** abrufbar.

          ---

          Die anderen Dateien (\`.yml\`, \`.blockmap\`, \`.zip\`) werden intern für automatische In-App-Updates benötigt und müssen nicht manuell heruntergeladen werden.
          NOTES
          gh release edit "$VERSION" --repo "$GH_REPO" --notes-file /tmp/notes.md
